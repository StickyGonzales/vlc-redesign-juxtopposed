# Cone for Linux release (redesign/LINUX_NOTES.md, Decision (Sticky) 3): Linux ships as its own
# beta, apart from the Windows release (release.yml, vX.Y.Z tags). Builds the public profile with
# build-linux.yml and prepares a GitHub Release with the AppImage, the portable tarball, the Debian
# package (amd64) and their
# SHA-256 checksums as a DRAFT pre-release: nothing is public until someone presses Publish on the
# draft in the Releases page.
#
# Runs on a pushed tag linux-vX.Y.Z or linux-vX.Y.Z-<label> (linux-v0.1.0-beta), or by hand from
# the Actions tab with "Use workflow from" set to such a tag. Only verified code is released: the
# tag must point at a commit of the redesign branch.
name: release-linux

on:
  push:
    tags: ['linux-v[0-9]*']
  workflow_dispatch:

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Only verified code (redesign), from a linux-v tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the redesign branch, to check where the commit comes from

      - name: Check tag and commit
        run: |
          case "$GITHUB_REF" in
            refs/tags/linux-v*) ;;
            *) echo "::error::run this from a linux-vX.Y.Z tag (Use workflow from > Tags)"; exit 1 ;;
          esac
          if ! echo "${GITHUB_REF_NAME#linux-v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not linux-vX.Y.Z or linux-vX.Y.Z-<label>"
            exit 1
          fi
          git fetch -q origin redesign
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/redesign; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on the redesign branch: only verified code is released"
            exit 1
          fi
          echo "Releasing $GITHUB_REF_NAME ($GITHUB_SHA)"

  build:
    needs: guard
    uses: ./.github/workflows/build-linux.yml
    # build-linux.yml's job asks for contents: write (the test builds' draft pre-release, which a
    # release build never touches); a called workflow gets no more than its caller grants
    permissions:
      contents: write

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the draft release
    steps:
      # the release file name check (release-asset-names.sh)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: src

      - uses: actions/download-artifact@v4
        with:
          name: cone-linux-appimage-x86_64
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: cone-linux-x86_64
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: cone-linux-deb-amd64
          path: out

      - name: Checksums and notes
        run: |
          cd out
          chmod +x ./*.AppImage
          # names GitHub keeps as they are, so SHA256SUMS.txt and the notes name the stored files
          # (linux-v1.1.2-beta2: the .deb's "~" was stored as ".")
          ../src/.github/scripts/release-asset-names.sh check ./*.AppImage ./*.tar.xz ./*.deb
          sha256sum ./*.AppImage ./*.tar.xz ./*.deb | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          VERSION=${GITHUB_REF_NAME#linux-v}
          # the oldest C library it runs with, from the package's readme
          GLIBC=$(tar -xJOf ./*.tar.xz --wildcards '*/README-LINUX.txt' | grep -o 'glibc [0-9.]*' | head -n 1)
          {
            echo "Cone $VERSION for Linux (x86_64). Experimental: based on the development version of VLC media player (VLC 4)."
            echo
            echo "- **AppImage**: download, \`chmod +x\` it, start it. AppImageLauncher or Gear Lever add it to the menu with its icon. A folder named \`portable\` next to it keeps settings and library there."
            echo "- **Portable tarball**: unpack, start \`./cone\`, or run \`./install.sh\` to install it for your user (no sudo; menu entry, icons, \"Open with\"). \`README-LINUX.txt\` inside explains the rest."
            echo "- **Debian / Ubuntu package** (amd64): \`sudo apt install ./cone-player_*_amd64.deb\`. Installs into \`/opt/cone-player\` with the command \`cone-player\`, next to VLC without replacing it; remove it with \`sudo apt remove cone-player\`."
            echo "- Needs a 64-bit Linux desktop (X11 or Wayland) with ${GLIBC:-a recent glibc} or newer."
            echo "- Cone keeps its own settings (\`~/.config/Cone\`, \`~/.local/share/Cone\`, \`~/.cache/Cone\`) and runs next to an installed VLC."
            echo "- \"Open with\" lists Cone Player for videos, music and subtitles; it never makes itself the default player."
            echo "- Checked on GitHub before release: H.264 and HEVC playback with subtitles, seeking, Settings, the menu, quitting, and installing and removing the tarball and the package (Ubuntu 24.04)."
            echo
            echo "Design by Juxtopposed (CC BY 4.0), built by StickyGonzales. Not affiliated with VideoLAN."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Built from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # a draft pre-release: published by hand on the Releases page, never by this workflow
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.AppImage out/*.tar.xz out/*.deb out/SHA256SUMS.txt \
            --draft --prerelease --verify-tag \
            --title "Cone ${GITHUB_REF_NAME#linux-v} for Linux" --notes-file out/notes.md
          echo "Draft: $(gh release view "$GITHUB_REF_NAME" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"
          # what GitHub stored: every file under its own name, every SHA256SUMS.txt line one of
          # them; a mismatch fails the run while the release is still a draft
          src/.github/scripts/release-asset-names.sh verify "$GITHUB_REF_NAME" \
            out/*.AppImage out/*.tar.xz out/*.deb out/SHA256SUMS.txt
