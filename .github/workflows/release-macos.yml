# Cone for macOS release (redesign/MACOS_NOTES.md): every release builds a Mac .dmg next to Windows
# and Linux. A pushed release tag (vX.Y.Z for Windows, linux-vX.Y.Z[-label] for Linux, or
# macos-vX.Y.Z[-label] for macOS alone) builds Cone for Apple Silicon and Intel with build-macos.yml
# (smoke checks included) and prepares a GitHub Release with both .dmg files and their SHA-256
# checksums as a DRAFT pre-release named macos-v<version>: nothing is public until someone presses
# Publish on the draft in the Releases page. A second tag of the same version (the Windows and the
# Linux release of one version) refreshes the same draft.
#
# Only verified code is released: the tag must point at a commit of the redesign branch.
name: release-macos

on:
  push:
    tags: ['v[0-9]*', 'linux-v[0-9]*', 'macos-v[0-9]*']
  workflow_dispatch:

concurrency:
  # one macOS release of a version at a time (v1.3.0 and linux-v1.3.0 share it)
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Only verified code (redesign), from a release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the redesign branch, to check where the commit comes from

      - name: Check tag and commit
        id: v
        run: |
          case "$GITHUB_REF" in
            refs/tags/macos-v*) V="${GITHUB_REF_NAME#macos-v}" ;;
            refs/tags/linux-v*) V="${GITHUB_REF_NAME#linux-v}" ;;
            refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;;
            *) echo "::error::run this from a release tag (Use workflow from > Tags)"; exit 1 ;;
          esac
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not a release tag (vX.Y.Z, linux-vX.Y.Z, macos-vX.Y.Z, with an optional -label)"
            exit 1
          fi
          git fetch -q origin redesign
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/redesign; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on the redesign branch: only verified code is released"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing Cone $V for macOS from $GITHUB_REF_NAME ($GITHUB_SHA)"

  build:
    needs: guard
    uses: ./.github/workflows/build-macos.yml
    with:
      intel: true
    # build-macos.yml's job asks for contents: write (the test builds' draft pre-release, which a
    # release build never touches); a called workflow gets no more than its caller grants
    permissions:
      contents: write

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the draft release
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      # the release file name check (release-asset-names.sh)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: src

      - uses: actions/download-artifact@v4
        with:
          name: cone-macos-arm64
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: cone-macos-x86_64
          path: out

      - name: Checksums and notes
        run: |
          cd out
          ls -la
          ../src/.github/scripts/release-asset-names.sh check ./*.dmg
          sha256sum ./*.dmg | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "Cone $VERSION for macOS, experimental preview. Based on the development version of VLC media player (VLC 4)."
            echo
            echo "- **Apple Silicon** (M1 and later): the \`-macos-arm64.dmg\`. **Intel Macs**: the \`-macos-x86_64.dmg\`. macOS 12 or later."
            echo "- Open the .dmg and drag **Cone Player** to Applications."
            echo "- Cone has no Apple Developer ID, so macOS blocks the first start. Right-click Cone Player in Applications > **Open** > **Open**. On macOS 15 and later: System Settings > Privacy & Security > \"Cone Player was blocked\" > **Open Anyway**."
            echo "- Cone keeps its own settings and runs next to an installed VLC without touching it."
            echo "- Checked on GitHub's Mac runners before release: the .dmg, the signature, the window, H.264 and HEVC playback with subtitles, quitting and every plug-in. Picture and sound are not checked there: please tell us how it plays on your Mac."
            echo
            echo "Design by Juxtopposed (CC BY 4.0), built by StickyGonzales. Not affiliated with VideoLAN."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Built from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # a draft pre-release: published by hand on the Releases page, never by this workflow. Its
      # tag is created only when someone publishes it
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="macos-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::$TAG is already published: a published release is never changed by this workflow"
              exit 1
            fi
            gh release upload "$TAG" out/*.dmg out/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file out/notes.md
            echo "Draft refreshed: $(gh release view "$TAG" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" out/*.dmg out/SHA256SUMS.txt \
              --draft --prerelease --target "$GITHUB_SHA" \
              --title "Cone $VERSION for macOS (experimental preview)" --notes-file out/notes.md
            echo "Draft: $(gh release view "$TAG" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # what GitHub stored: every file under its own name, every SHA256SUMS.txt line one of
          # them; a mismatch fails the run while the release is still a draft
          src/.github/scripts/release-asset-names.sh verify "$TAG" out/*.dmg out/SHA256SUMS.txt
