# Windows 64-bit build of the redesign branch.
# Mirrors VideoLAN's own "win64" job (extras/ci/gitlab-ci.yml): same Docker image,
# same build script (extras/package/win32/build.sh) and the same prebuilt contribs.
# The release workflow (release.yml) calls it for the "public" profile (redesign/CI_RELEASE_NOTES.md).
name: build-windows

on:
  push:
    branches: [redesign]
    # documentation-only pushes (status, plans, notes) do not need a build
    paths-ignore:
      - 'redesign/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CREDITS.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      brand:
        # brand layer (modules/gui/qt/util/brand.hpp): vlc = VLC's name and cone (Sticky's test
        # builds), public = "Cone" and its logo. Pushes build "public" (Decision 50).
        description: 'Brand profile'
        type: choice
        options: [vlc, public]
        default: public
      package-suffix:
        # brand layer: appended to the public profile's package names only (e.g. "-rc1":
        # ConePlayer-1.0.0-rc1-win64.zip), never to the app's version
        description: 'Package name suffix (public profile, e.g. -beta)'
        type: string
        default: ''
      signing-dry-run:
        # release signing (CODE_SIGNING_POLICY.md): runs the signing path of a release without
        # SignPath, the unsigned Cone.exe standing in for the signed one, to check the packaging
        description: 'Check the release signing path without SignPath (public profile)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      brand:
        type: string
        default: public
      release:
        # release build: the installer must succeed, both packages are handed to the caller as the
        # cone-release-files artifact, and the compiler cache is read but not saved (a tag's cache
        # can not be restored by any later run)
        type: boolean
        default: false
      cache-branch:
        # the branch whose compiler cache the build starts from (a tag run has no branch)
        type: string
        default: ''
      version:
        # the release's version tag (v1.0.0, v1.0.0-rc1): sets the public profile's version and
        # package names like a pushed tag does; a manual release run builds a branch, not the tag
        type: string
        default: ''
    secrets:
      # release signing (CODE_SIGNING_POLICY.md, redesign/SUBMIT_TO_SIGNPATH.md): a release signs
      # Cone.exe and the installer through SignPath only when this secret and the repository
      # variable SIGNPATH_ORGANIZATION_ID are set; otherwise it is built unsigned, as before
      SIGNPATH_API_TOKEN:
        required: false
    outputs:
      signed:
        description: "'true' when Cone.exe and the installer were signed through SignPath"
        value: ${{ jobs.win64.outputs.signed }}

concurrency:
  # one queue per branch and brand profile: a vlc and a public build of the same branch run side by
  # side; github.workflow is the caller's name when release.yml calls this, so a release never
  # cancels a normal build
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.brand || 'public' }}
  cancel-in-progress: true

env:
  # Keep in sync with VLC_WIN64_IMAGE in extras/ci/gitlab-ci.yml
  VLC_IMAGE: registry.videolan.org/vlc-debian-win64-posix:20260611225331
  # brand profile: the workflow_dispatch / workflow_call input, "public" for pushes (Decision 50)
  VLC_BRAND: ${{ inputs.brand || 'public' }}
  # ccache used when the build image has none: pinned release and its SHA-256
  CCACHE_VERSION: 4.10.2
  CCACHE_SHA256: 80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18

jobs:
  win64:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # contents: write for the test builds' draft pre-release (.github/scripts/test-build-assets.sh);
    # actions: read for SignPath, which fetches the unsigned files from this run's artifacts; a
    # calling workflow (release.yml) must grant both to its build job
    permissions:
      contents: write
      actions: read
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # get-contrib-sha.sh needs the history

      - name: Contrib SHA and prebuilt URL
        id: sha
        run: |
          SHA=$(extras/ci/get-contrib-sha.sh win64)
          # our own commits change the packaging scripts (brand layer: extras/package/win32), which
          # moves VLC's contrib key to a commit VideoLAN never built; when none of our commits
          # touches the contribs themselves, use the upstream key (VLC's master in this fork)
          UPSTREAM=$(git merge-base HEAD origin/master)
          if ! git merge-base --is-ancestor "$SHA" "$UPSTREAM"              && [ -z "$(git rev-list -1 HEAD ^"$UPSTREAM" -- contrib extras/tools extras/ci)" ]; then
            SHA=$(git rev-list -1 "$UPSTREAM" -- contrib extras/tools extras/ci extras/package/win32)
            echo "Contrib key from upstream: $SHA"
          fi
          URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${SHA}.tar.zst"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if extras/ci/check-url.sh "$URL"; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "Prebuilt contribs found: $URL"
          else
            echo "No prebuilt contribs for $SHA, contribs will be built from source"
          fi

      - name: Cache contribs built from source
        if: steps.sha.outputs.url == ''
        uses: actions/cache@v4
        with:
          path: |
            contrib/x86_64-w64-mingw32
            contrib/tarballs
          key: contrib-win64-${{ steps.sha.outputs.sha }}

      - name: Cache extra tools
        uses: actions/cache@v4
        with:
          path: extras/tools/build
          key: tools-win64-${{ steps.sha.outputs.sha }}

      # Compiler cache, one per branch and brand profile. Keys are "ccache-win64-<brand>:<branch>:<commit>"
      # (":" can not appear in a branch name, so one branch's prefix never matches another's). A run
      # restores, in order: its own branch and brand, its own branch with the other brand, then the
      # redesign branch (same brand first). Other branches can read redesign's caches because it is
      # the default branch; they can never read each other's.
      - name: Compiler cache keys
        id: cachekey
        env:
          CACHE_BRANCH: ${{ inputs.cache-branch || github.ref_name }}
        run: |
          OTHER=$([ "$VLC_BRAND" = public ] && echo vlc || echo public)
          {
            echo "key=ccache-win64-$VLC_BRAND:$CACHE_BRANCH:$GITHUB_SHA"
            echo "restore<<EOF"
            echo "ccache-win64-$VLC_BRAND:$CACHE_BRANCH:"
            echo "ccache-win64-$OTHER:$CACHE_BRANCH:"
            echo "ccache-win64-$VLC_BRAND:redesign:"
            echo "ccache-win64-$OTHER:redesign:"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Compiler cache for branch '$CACHE_BRANCH', brand '$VLC_BRAND'"

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}

      - name: Compiler cache restored
        env:
          MATCHED: ${{ steps.ccache.outputs.cache-matched-key }}
          WANTED: ${{ steps.cachekey.outputs.key }}
        run: |
          if [ -z "$MATCHED" ]; then
            MSG="no compiler cache found: cold build, every file is compiled"
          elif [ "$MATCHED" = "$WANTED" ]; then
            MSG="compiler cache of this exact commit: $MATCHED"
          else
            MSG="compiler cache restored from $MATCHED"
          fi
          echo "$MSG"
          echo "Compiler cache: $MSG" >> "$GITHUB_STEP_SUMMARY"
          du -sh .ccache 2>/dev/null || true

      # without it (download failed) the build still runs, only without the compiler cache
      - name: ccache for the build image
        continue-on-error: true
        run: |
          # the image's own ccache is used when it has one (win64-build.sh); this one otherwise
          mkdir -p .ccache-tool
          curl -sSLf -o /tmp/ccache.tar.xz \
            "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-linux-x86_64.tar.xz"
          echo "$CCACHE_SHA256  /tmp/ccache.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ccache.tar.xz -C .ccache-tool --strip-components=1 "ccache-$CCACHE_VERSION-linux-x86_64/ccache"

      - name: Pull build image
        run: docker pull "$VLC_IMAGE"

      - name: Build in VideoLAN's image
        id: build
        env:
          PACKAGE_SUFFIX_INPUT: ${{ inputs.package-suffix }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # run as the runner's user so the checkout, caches and build output have one owner
          mkdir -p .ccache
          # the public profile's own version (Decision 58): a vX.Y.Z tag sets it, otherwise 0.1.0;
          # a vX.Y.Z-<label> tag (v0.1.0-beta) sets X.Y.Z and puts "-<label>" into the package
          # names only (BRAND_PACKAGE_SUFFIX, extras/package/win32/package.mak), like the
          # workflow_dispatch input package-suffix; release.yml passes its tag as the input version
          BRAND_VERSION=""
          BRAND_PACKAGE_SUFFIX="$PACKAGE_SUFFIX_INPUT"
          case "$GITHUB_REF" in refs/tags/v*) BRAND_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          if [ -n "$VERSION_INPUT" ]; then BRAND_VERSION="${VERSION_INPUT#v}"; fi
          if echo "$BRAND_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.]+$'; then
            BRAND_PACKAGE_SUFFIX="-${BRAND_VERSION#*-}"
            BRAND_VERSION="${BRAND_VERSION%%-*}"
          fi
          if [ -n "$BRAND_VERSION" ] && ! echo "$BRAND_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::tag ${VERSION_INPUT:-$GITHUB_REF_NAME} is not vX.Y.Z: the build uses the default version"
            BRAND_VERSION=""
          fi
          if [ -n "$BRAND_PACKAGE_SUFFIX" ] && ! echo "$BRAND_PACKAGE_SUFFIX" | grep -Eq '^-[A-Za-z0-9.]+$'; then
            echo "::warning::the package suffix is not -<letters, digits, dots>: not used"
            BRAND_PACKAGE_SUFFIX=""
          fi
          # the signing path makes the zip again, under the same name
          echo "package_suffix=$BRAND_PACKAGE_SUFFIX" >> "$GITHUB_OUTPUT"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/build" -w /build -e HOME=/tmp \
            -e VLC_PREBUILT_CONTRIBS_URL="${{ steps.sha.outputs.url }}" \
            -e VLC_BRAND="$VLC_BRAND" \
            -e BRAND_VERSION="$BRAND_VERSION" \
            -e BRAND_PACKAGE_SUFFIX="$BRAND_PACKAGE_SUFFIX" \
            "$VLC_IMAGE" .github/scripts/win64-build.sh build
          df -h /

      - name: Compiler cache result
        if: ${{ !cancelled() }}
        run: |
          SUMMARY=$(cat .ccache-summary.txt 2>/dev/null || echo "ccache: no statistics (the build did not reach ccache)")
          echo "$SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          du -sh .ccache 2>/dev/null || true

      # saved even when the build failed, so the next run starts from what was compiled
      - name: Save compiler cache
        if: ${{ !cancelled() && !inputs.release && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.cachekey.outputs.key }}

      - name: Unpack zip so the artifact is a single zip
        run: |
          ls -la win64/*.zip
          mkdir dist
          # vlc-<version>-win64.zip, or ConePlayer-<version><suffix>-win64.zip in the public profile
          unzip -q "$(ls win64/*-win64.zip | head -n 1)" -d dist
          ls dist dist/*

      # Actions artifact storage is small (500 MB for the account): every artifact lives one day,
      # and a full storage (a failed upload) does not fail the build; test builds are also attached
      # to the "test-builds" draft pre-release below (redesign/TEST_BUILDS.md)
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.VLC_BRAND == 'public' && 'vlc-redesign-win64-public' || 'vlc-redesign-win64' }}
          path: dist/
          retention-days: 1

      # brand layer: Cone's NSIS installer next to the zip (redesign/INSTALLER_NOTES.md); the zip is
      # uploaded first, so a failing installer still leaves it; a failure here keeps a test build
      # green, a release fails
      # release signing (CODE_SIGNING_POLICY.md, redesign/SUBMIT_TO_SIGNPATH.md): "signpath" for a
      # release when the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable exist,
      # "dry-run" for a manual run with signing-dry-run (the signing path without SignPath), "off"
      # otherwise: the installer is built as before and nothing is signed
      - name: Release signing
        id: signing
        if: env.VLC_BRAND == 'public'
        env:
          RELEASE: ${{ inputs.release }}
          DRY_RUN: ${{ inputs.signing-dry-run }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          MODE=off
          if [ "$RELEASE" = true ] && [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            MODE=signpath
            MSG="Code signing: Cone.exe and the installer are signed through SignPath"
          elif [ "$DRY_RUN" = true ]; then
            MODE=dry-run
            MSG="Code signing: dry run of the signing path, nothing is signed"
          elif [ "$RELEASE" = true ]; then
            MSG="Code signing: off (no SIGNPATH_API_TOKEN secret or SIGNPATH_ORGANIZATION_ID variable), the release is unsigned"
            echo "::notice::$MSG"
          else
            MSG="Code signing: off (test build)"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "signed=$([ "$MODE" = signpath ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Cone installer
        if: env.VLC_BRAND == 'public' && steps.signing.outputs.mode == 'off'
        continue-on-error: ${{ !inputs.release }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/build" -w /build -e HOME=/tmp \
            "$VLC_IMAGE" .github/scripts/win64-build.sh installer
          ls -la win64/*.exe

      # the signing path: Cone.exe is signed first, then the installer and the zip are made with the
      # signed Cone.exe, then the installer itself is signed; every SignPath request waits for an
      # approver's manual approval in SignPath (up to 1 hour each: two waits and the build stay within the job's 350 minutes)
      - name: Stage the release files for signing
        if: steps.signing.outputs.mode == 'signpath' || steps.signing.outputs.mode == 'dry-run'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/build" -w /build -e HOME=/tmp \
            "$VLC_IMAGE" .github/scripts/win64-build.sh stage-for-signing
          ls -la sign/unsigned

      - name: Upload the unsigned Cone.exe for SignPath
        id: upload-exe
        if: steps.signing.outputs.mode == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: sign/unsigned/Cone.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign Cone.exe (SignPath, waits for the approval)
        if: steps.signing.outputs.mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'cone-player' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIGURATION_SLUG || 'cone-exe' }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: sign/signed-exe
          skip-decompress: true

      - name: Installer and zip with the signed Cone.exe
        if: steps.signing.outputs.mode == 'signpath' || steps.signing.outputs.mode == 'dry-run'
        env:
          SIGNING_DRY_RUN: ${{ steps.signing.outputs.mode == 'dry-run' }}
          BRAND_PACKAGE_SUFFIX: ${{ steps.build.outputs.package_suffix }}
        run: |
          if [ "$SIGNING_DRY_RUN" = true ]; then
            mkdir -p sign/signed-exe
            cp sign/unsigned/Cone.exe sign/signed-exe/Cone.exe
          fi
          FILES=(sign/signed-exe/*)
          [ ${#FILES[@]} -eq 1 ] && [ -f "${FILES[0]}" ] \
            || { echo "::error::expected one signed file in sign/signed-exe: ${FILES[*]}"; exit 1; }
          SIGNED=${FILES[0]}
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/build" -w /build -e HOME=/tmp \
            -e SIGNING_DRY_RUN -e BRAND_PACKAGE_SUFFIX \
            "$VLC_IMAGE" .github/scripts/win64-build.sh package-signed "$SIGNED"
          # the zip holds exactly the signed Cone.exe
          ZIP=$(ls win64/*-win64.zip | head -n 1)
          unzip -p "$ZIP" '*/Cone.exe' | cmp - "$SIGNED" \
            || { echo "::error::$ZIP does not hold the signed Cone.exe"; exit 1; }
          echo "Cone.exe in $ZIP: $(sha256sum "$SIGNED" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          # the smoke checks take the zip that is released: the artifact again, from the new zip
          rm -rf dist
          mkdir dist
          unzip -q "$ZIP" -d dist

      - name: Upload the zip with the signed Cone.exe for the smoke checks
        if: steps.signing.outputs.mode == 'signpath' || steps.signing.outputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vlc-redesign-win64-public
          path: dist/
          overwrite: true
          retention-days: 1

      - name: Upload the unsigned installer for SignPath
        id: upload-installer
        if: steps.signing.outputs.mode == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: win64/coneplayer-*-win64.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath, waits for the approval)
        if: steps.signing.outputs.mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'cone-player' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG || 'cone-installer' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: sign/signed-installer
          skip-decompress: true

      - name: Signed installer in place
        if: steps.signing.outputs.mode == 'signpath'
        run: |
          FILES=(sign/signed-installer/*)
          [ ${#FILES[@]} -eq 1 ] && [ -f "${FILES[0]}" ] \
            || { echo "::error::expected one signed installer: ${FILES[*]}"; exit 1; }
          TARGET=$(ls win64/coneplayer-*-win64.exe)
          if cmp -s "${FILES[0]}" "$TARGET"; then
            echo "::error::the signed installer is the same file as the unsigned one"
            exit 1
          fi
          cp "${FILES[0]}" "$TARGET"
          echo "Signed installer $(basename "$TARGET"): $(sha256sum "$TARGET" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.VLC_BRAND == 'public' && hashFiles('win64/coneplayer-*-win64.exe') != ''
        continue-on-error: true
        with:
          name: cone-installer-win64
          path: win64/coneplayer-*-win64.exe
          retention-days: 1

      # test builds only (a run of this workflow itself, not a release workflow calling it): the
      # zip and the installer on the "test-builds" draft pre-release, replacing this branch's
      # previous ones; also after a failed installer step, with the zip alone
      - name: Attach to the test-builds draft pre-release
        if: ${{ !cancelled() && github.workflow == 'build-windows' && !inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/test-build-assets.sh \
            "win64-$VLC_BRAND.zip=$(ls win64/*-win64.zip 2>/dev/null | head -n 1)" \
            "win64-installer.exe=$(ls win64/*-win64.exe 2>/dev/null | head -n 1)"

      # release.yml: both packages exactly as built (ConePlayer-<version>-win64.zip and
      # coneplayer-<version>-win64.exe, redesign/RENAME_CONE_PLAYER.md), for the release job of the
      # same run only; release-package.sh checks the names
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: cone-release-files
          path: |
            win64/ConePlayer-*-win64.zip
            win64/coneplayer-*-win64.exe
          if-no-files-found: error
          retention-days: 1


  # after every public build: smoke checks of the portable zip and the installer on a Windows
  # runner (smoke-windows.yml, redesign/CI_SMOKE_NOTES.md); a failed check fails the run
  smoke:
    needs: win64
    if: (inputs.brand || 'public') == 'public'
    uses: ./.github/workflows/smoke-windows.yml
