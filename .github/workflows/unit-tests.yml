name: unit-tests

# Cone's QtCore-only unit tests (.github/scripts/unit-tests.sh): the storage cleanup rules, the
# background queue, the episode parser, the show tracks, the credits point and audio, the
# on-screen message parser. A few minutes on a plain runner, no VLC build.
on:
  workflow_dispatch:
  push:
    branches: ['wip/**', redesign]
    paths:
      - 'modules/gui/qt/util/rd_storage_model.*'
      - 'modules/gui/qt/util/rd_background_queue.*'
      - 'modules/gui/qt/player/rd_show_tracks.*'
      - 'modules/gui/qt/player/rd_episode_parser.*'
      - 'modules/gui/qt/player/rd_credits_audio.*'
      - 'modules/gui/qt/player/rd_credits_point.*'
      - 'modules/gui/qt/player/rd_osd_parse.*'
      - 'modules/gui/qt/tests/test_rd_*'
      - '.github/scripts/unit-tests.sh'
      - '.github/workflows/unit-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Qt 6 for the tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qt6-base-dev qt6-base-dev-tools g++ pkg-config
      - name: Build and run
        run: .github/scripts/unit-tests.sh "$RUNNER_TEMP/unit-tests"
